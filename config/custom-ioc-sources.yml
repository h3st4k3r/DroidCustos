# DroidCustos explicit mobile STIX source catalogue
# Author: h3st4k3r
#
# Schema supported by DroidCustos 0.3.2:
#
#   sources:
#     - name: Human-readable source name
#       sources:
#         - Provider
#       references:
#         - https://research-reference.example/
#       github:
#         owner: organisation
#         repo: repository
#         branch: main
#         path: path/to/file.stix2
#
# This catalogue mirrors the public mobile-forensics sources indexed by
# mvt-project/mvt-indicators as reviewed on 2026-08-03.
#
# IMPORTANT:
# DroidCustos already clones the official MVT indicator index automatically.
# Keep this file as an explicit catalogue, fallback or auditable source list.
# Passing it together with the automatic index in DroidCustos 0.3.2 can
# download duplicate bundles under different source records.
#
# Do not add unverified feeds merely to increase the indicator count.
# Large generic feeds can create stale matches and false positives.

